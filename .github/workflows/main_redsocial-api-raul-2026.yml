# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - redsocial-api-raul-2026

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: zxrrrrrIlovechyoung/FRONTEND-REDSOCIAL
          ref: main
          path: frontend-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build src/RedSocial.API/RedSocial.API.csproj --configuration Release

      - name: Build frontend in same origin mode
        shell: pwsh
        env:
          VITE_API_URL: /api
        run: |
          npm ci --prefix frontend-source
          npm run build --prefix frontend-source
          Get-ChildItem frontend-source/dist | Where-Object { $_.Name -ne 'staticwebapp.config.json' } | ForEach-Object {
            Copy-Item $_.FullName -Destination src/RedSocial.API/wwwroot -Recurse -Force
          }

      - name: dotnet publish
        run: dotnet publish src/RedSocial.API/RedSocial.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B83B0C4B19DC4B19857BFA7E1448CA80 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1A99336A5FFB4AF699C8E05C40C1F74E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E76697A8A4FC48B09AC875B0F41E747F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'redsocial-api-raul-2026'
          slot-name: 'Production'
          package: .
          
